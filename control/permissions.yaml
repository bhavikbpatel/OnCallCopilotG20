# Who may call which tool. Keys are "<server>.<tool>"; "*" matches any tool on a server.
# Diagnosis agents have no write tools at all; only remediation (and the C1/C0 baselines)
# can reach ops-actions writes, and every one of those still needs an approval token.
# Roles are the AGENT_ROLES of eval/schemas/catalogue.py.
default_budget:
  max_tool_calls: 10          # E4 runs 5, 10 and 20; pass max_tool_calls to Hooks to override

roles:
  commander:
    allow: [tickets.get_incident]
  triage:
    allow: [telemetry.query_promql, telemetry.recent_changes, tickets.create_incident, tickets.get_incident]
  diagnosis:
    allow: [telemetry.query_promql, telemetry.search_logs, telemetry.get_traces, telemetry.recent_changes]
  runbook:
    allow: [runbooks-kb.search, runbooks-kb.get, memory.search_incidents]
  remediation:
    allow: [ops-actions.dry_run, ops-actions.set_flag, ops-actions.restart_service,
            ops-actions.scale_service, ops-actions.rollback, telemetry.query_promql]
  comms:
    allow: [tickets.get_incident, tickets.append_timeline, tickets.draft_status,
            tickets.save_postmortem, tickets.publish_status]
  single_agent:                # C1: one agent with the union of all tools, same hooks and gate
    allow: ["telemetry.*", "runbooks-kb.*", "tickets.*", "ops-actions.*", memory.search_incidents]
  fixed_workflow:              # C0: scripted workflow, same tools, no agent decisions
    allow: ["telemetry.*", "runbooks-kb.*", "tickets.*", "ops-actions.*", memory.search_incidents]
