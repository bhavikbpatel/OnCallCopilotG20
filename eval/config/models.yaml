# Models used by the evaluation harness (Person 4).
# Agent models are owned by Person 2 in the team's versioned config; only their
# vendor family is recorded here so the judge can be checked to differ from it.

provider:
  name: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY   # set in eval/.env (git-ignored), never in this file
  key_valid_until: 2026-11-16

judge:
  # Capstone guide: a model from a different family than the agents.
  model: google/gemini-3.1-flash-lite
  fallback_model: meta-llama/llama-3.3-70b-instruct
  temperature: 0
  max_tokens: 800

# Vendor prefixes of the agent models (capstone guide: OpenAI models for the agents).
agent_model_families: [openai]

# Models the course key allows (as issued on 31 Oct 2026). Anything else is refused.
allowed_models:
  - openai/gpt-6-luna
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/gpt-5.4-nano
  - openai/gpt-4.1-mini
  - openai/gpt-4.1-nano
  - openai/gpt-4o-mini
  - openai/gpt-oss-120b
  - anthropic/claude-haiku-5.5
  - anthropic/claude-3-haiku
  - google/gemini-3.1-flash-lite
  - google/gemma-4-31b-it
  - qwen/qwen3.7-plus
  - qwen/qwen3.6-plus
  - qwen/qwen3.8-27b
  - qwen/qwen3.5-35b-a3b
  - qwen/qwen3.5-9b
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-chat
  - z-ai/glm-5.3
  - z-ai/glm-5.3-flash
  - meta-llama/llama-3.3-70b-instruct
  - meta-llama/llama-3.1-70b-instruct
  - meta-llama/llama-3.1-8b-instruct
  - amazon/nova-lite-v1
