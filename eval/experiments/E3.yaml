# E3: did the lessons help? (capstone guide p. 6)
# Held-out results before and after adding the playbook. Both arms are identical to runs other
# experiments already make, so E3 adds no runs of its own.
experiment: E3
question: Did the playbook of lessons improve held-out results, and did any lesson make them worse?
guide: "capstone guide p. 6, E3"
cases: heldout
repeats: 1
arms:
  - id: before
    description: No playbook (memory off)
    options: {memory: "off"}
    reuse: E4/memory-off
  - id: after
    description: Frozen playbook, read-only
    options: {memory: playbook}
    reuse: E1/C2
compare:
  - {arms: [before, after], varies: [memory]}
notes: >
  "Before" is memory off: no lessons and no past-incident write-ups (the runbook search drops postmortems
  when memory is off). "After" is the frozen playbook plus the past-incident write-ups whose fix is in
  play now. So E3 measures long-term memory as a whole, the same comparison as E4 memory-on vs
  memory-off; the playbook's own share is shown by the lessons each run used (result line lessons_used),
  which python -m eval.report --experiments lists with the runs that got worse. Also report the cost of
  generating the lessons (docs/playbook/playbook.json generation_cost) and the review time.
