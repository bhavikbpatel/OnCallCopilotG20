case_id: D-019
title: Intermittent payment errors at 25%
scenario_group: payment-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: paymentFailure
  variant: 25%
  start_after_s: 0
  mode: intermittent
  on_s: 60
  off_s: 60
load:
  profile: normal
alert:
  name: CheckoutErrorRateHigh
  service: checkout
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: payment
    fault_type: paymentFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: paymentFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: payment
  - tool: rollback
  recovery:
    signal: error_rate
    service: payment
    measure: since_fix
    threshold: 0.05
    within_s: 420
    settle_s: 90
  severity:
    level: SEV-1
    rule: S1.1
    provisional: true
notes: 'Fault flips on and off every minute: tests the agent does not conclude ''recovered'' too early.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
