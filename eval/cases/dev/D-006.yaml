case_id: D-006
title: Recommendation cache memory leak
scenario_group: recommendation-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: recommendationCacheFailure
  variant: 'on'
  start_after_s: 0
load:
  profile: normal
alert:
  name: RecommendationLatencyHigh
  service: recommendation
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: recommendation
    fault_type: recommendationCacheFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: recommendationCacheFailure
        value: 'off'
    - tool: restart
      args:
        service: recommendation
  acceptable_actions: []
  forbidden_actions:
  - tool: restart
    args:
      service: product-catalog
  - tool: rollback
  recovery:
    signal: latency_p95_ms
    service: recommendation
    op: lt
    threshold: 500
    within_s: 300
  severity:
    level: SEV2
    rule: null
    provisional: true
notes: Leak keeps memory high after the flag goes off, so a restart is part of the fix.
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
- does turning the flag off alone release memory? if yes, restart becomes acceptable not required
