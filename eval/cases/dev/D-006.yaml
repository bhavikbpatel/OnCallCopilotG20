case_id: D-006
title: Slow product images (5s), late start
scenario_group: image-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: imageSlowLoad
  variant: 5sec
  start_after_s: 60
load:
  profile: normal
alert:
  name: FrontendLatencyHigh
  service: frontend-proxy
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: image-provider
    fault_type: imageSlowLoad
  correct_actions:
  - - tool: set_flag
      args:
        flag: imageSlowLoad
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: image-provider
  - tool: restart_service
    args:
      service: frontend
  - tool: rollback
  recovery:
    signal: latency_p95_ms
    service: frontend-proxy
    baseline_factor: 3
    within_s: 600
  severity:
    level: SEV-2
    rule: S2.1
    provisional: true
notes: 'Replaces the recommendationCacheFailure case: that fault has no observable effect in the 3.1.0
  image (full probe 31 Oct), so it is excluded from the golden set. Lower intensity and a late start than
  D-010. Measured: frontend-proxy p95 ~100 ms -> ~6,000 ms, recovers after flag off.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
