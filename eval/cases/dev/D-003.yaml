case_id: D-003
title: Cart failures at 50%
scenario_group: cart-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: cartFailure
  variant: 50%
  start_after_s: 0
load:
  profile: normal
alert:
  name: CartErrorRateHigh
  service: cart
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: cart
    fault_type: cartFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: cartFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: cart
  - tool: restart_service
    args:
      service: valkey-cart
  - tool: rollback
  recovery:
    signal: error_count
    service: cart
    measure: since_fix
    threshold: 1
    within_s: 300
    settle_s: 90
  severity:
    level: SEV2
    rule: S2.1
    provisional: true
notes: 'Medium intensity: only EmptyCart calls fail, so the signal is a small error count. Was 25% until 5 Nov:
  in the first dev batch its alert never fired (cart error count stayed below 2).'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
