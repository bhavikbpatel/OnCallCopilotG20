case_id: D-005
title: Product catalog fails for one product
scenario_group: catalog-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: productCatalogFailure
  variant: 'on'
  start_after_s: 0
load:
  profile: normal
alert:
  name: ProductCatalogErrorRateHigh
  service: product-catalog
  provisional: true
expected:
