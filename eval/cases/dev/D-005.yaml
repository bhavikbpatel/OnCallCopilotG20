  root_causes:
  - service: product-catalog
    fault_type: productCatalogFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: productCatalogFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: product-catalog
  - tool: rollback
  recovery:
    signal: error_rate
    service: product-catalog
    measure: since_fix
    threshold: 0.02
    within_s: 300
    settle_s: 90
  severity:
    level: SEV-2
    rule: S2.1
    provisional: true
notes: 'Only product OLJCESPC7Z errors: a narrow, low-impact fault.'
