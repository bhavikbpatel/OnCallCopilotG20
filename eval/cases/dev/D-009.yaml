case_id: D-009
title: Email memory leak at 1000x
scenario_group: email-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: emailMemoryLeak
  variant: 1000x
  start_after_s: 0
load:
  profile: normal
alert:
  name: EmailMemoryHigh
  service: email
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: email
    fault_type: emailMemoryLeak
  correct_actions:
  - - tool: set_flag
      args:
        flag: emailMemoryLeak
        variant: 'off'
  - - tool: set_flag
      args:
        flag: emailMemoryLeak
        variant: 'off'
    - tool: restart_service
      args:
        service: email
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: checkout
  - tool: rollback
  recovery:
    signal: memory_mb
    service: email
    baseline_factor: 1.3
    within_s: 900
  severity:
    level: SEV-3
    rule: S3.1
    provisional: true
notes: 'Memory grows per confirmation email. Measured 31 Oct: 66 -> 100 MB at 1000x; in one run it fell
  back to 53 MB after the flag went off without a restart, in the 300 s re-probe it stayed at 96 MB for
  3 minutes. So flag off alone is correct if memory comes back, and flag off plus a restart of email is
  correct too; recovery gets 15 minutes.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
