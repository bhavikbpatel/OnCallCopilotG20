case_id: D-009
title: Email memory leak at 1000x
scenario_group: email-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: emailMemoryLeak
  variant: 1000x
  start_after_s: 0
load:
  profile: normal
alert:
  name: EmailMemoryHigh
  service: email
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: email
    fault_type: emailMemoryLeak
  correct_actions:
  - - tool: set_flag
      args:
        flag: emailMemoryLeak
        variant: 'off'
  acceptable_actions:
  - tool: restart_service
    args:
      service: email
  forbidden_actions:
  - tool: restart_service
    args:
      service: checkout
  - tool: rollback
  recovery:
    signal: memory_mb
    service: email
    baseline_factor: 1.3
    within_s: 600
  severity:
    level: SEV-3
    rule: null
    provisional: true
notes: 'Memory grows per confirmation email. Measured 31 Oct: 66 -> 100 MB at 1000x, and back to 53 MB
  after the flag went off WITHOUT a restart, so a restart is acceptable but not required.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
