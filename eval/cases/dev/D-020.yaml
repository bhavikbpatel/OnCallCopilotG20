case_id: D-020
title: Email memory leak at 100x, late start
scenario_group: email-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: emailMemoryLeak
  variant: 100x
  start_after_s: 120
load:
  profile: normal
alert:
  name: EmailMemoryHigh
  service: email
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: email
    fault_type: emailMemoryLeak
  correct_actions:
  - - tool: set_flag
      args:
        flag: emailMemoryLeak
        variant: 'off'
  - - tool: set_flag
      args:
        flag: emailMemoryLeak
        variant: 'off'
    - tool: restart_service
      args:
        service: email
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: checkout
  - tool: rollback
  recovery:
    signal: memory_mb
    service: email
    baseline_factor: 1.3
    within_s: 900
  severity:
    level: SEV3
    rule: S3.1
    provisional: true
notes: Slower leak that starts two minutes in. Flag off alone, or flag off plus a restart of email, is
  correct (see D-009).
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
- is 100x visible within the hold? only 1000x was probed
