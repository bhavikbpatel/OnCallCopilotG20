case_id: D-002
title: Payment errors at 100% under flood load
scenario_group: payment-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: paymentFailure
  variant: 100%
  start_after_s: 0
load:
  profile: flood
alert:
  name: CheckoutErrorRateHigh
  service: checkout
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: payment
    fault_type: paymentFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: paymentFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: payment
  - tool: restart_service
    args:
      service: checkout
  - tool: rollback
  recovery:
    signal: error_rate
    service: payment
    measure: since_fix
    threshold: 0.05
    within_s: 300
    settle_s: 90
  severity:
    level: SEV1
    rule: S1.1
    provisional: true
notes: 'Highest intensity plus a homepage traffic flood: the flood is a distractor, not a cause.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
