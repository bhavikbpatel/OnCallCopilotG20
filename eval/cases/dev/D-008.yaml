case_id: D-008
title: Ad service errors, late start
scenario_group: ad-B
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: adFailure
  variant: 'on'
  start_after_s: 120
load:
  profile: normal
alert:
  name: AdErrorRateHigh
  service: ad
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: ad
    fault_type: adFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: adFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: ad
  - tool: rollback
  recovery:
    signal: error_rate
    service: ad
    measure: since_fix
    threshold: 0.03
    within_s: 300
    settle_s: 90
  severity:
    level: SEV-3
    rule: S3.1
    provisional: true
notes: 'Replaces the adHighCpu case (1 Nov): adHighCpu had no observable effect in the 300 s re-probe
  and is excluded. Same fault as D-014, starting two minutes in (timing variant). Measured: ad error rate
  0 -> 0.13, recovers after the flag goes off.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
