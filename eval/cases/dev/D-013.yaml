case_id: D-013
title: Product catalog fails for one product, late start
scenario_group: catalog-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: productCatalogFailure
  variant: 'on'
  start_after_s: 120
load:
  profile: normal
alert:
  name: ProductCatalogErrorRateHigh
  service: product-catalog
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: product-catalog
    fault_type: productCatalogFailure
  correct_actions:
  - - tool: set_flag
      args:
        flag: productCatalogFailure
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: product-catalog
  - tool: rollback
  recovery:
    signal: error_rate
    service: product-catalog
    measure: since_fix
    threshold: 0.02
    within_s: 300
    settle_s: 90
  severity:
    level: SEV-2
    rule: S2.1
    provisional: true
notes: 'Replaces the intlShippingSlowdown case (1 Nov): that fault is excluded because its effect depends
  on whether the load generator sends international orders (no slow shipping request in three runs on
  1 Nov). Timing variant of D-005; severity from Person 1''s policy (partial impact, ~9% errors).'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
