case_id: D-018
title: 'Two faults: cart failures and ad CPU'
scenario_group: twofault-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: cartFailure
  variant: 50%
  start_after_s: 0
- flag: adHighCpu
  variant: 'on'
  start_after_s: 60
load:
  profile: normal
alert:
  name: CartErrorRateHigh
  service: cart
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: cart
    fault_type: cartFailure
  - service: ad
    fault_type: adHighCpu
  correct_actions:
  - - tool: set_flag
      args:
        flag: cartFailure
        value: 'off'
    - tool: set_flag
      args:
        flag: adHighCpu
        value: 'off'
  acceptable_actions:
  - tool: scale
    args:
      service: ad
  forbidden_actions:
  - tool: restart
    args:
      service: cart
  - tool: restart
    args:
      service: valkey-cart
  - tool: rollback
  recovery:
    signal: error_count
    service: cart
    measure: since_fix
    threshold: 1
    within_s: 300
    settle_s: 90
  severity:
    level: SEV2
    rule: null
    provisional: true
notes: Two faults with different signal types (errors vs CPU).
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
