case_id: D-018
title: 'Two faults: cart failures and Kafka queue problems'
scenario_group: twofault-A
split: dev
written_on: '2026-10-31'
written_by: Person 4
faults:
- flag: cartFailure
  variant: 50%
  start_after_s: 0
- flag: kafkaQueueProblems
  variant: 'on'
  start_after_s: 60
load:
  profile: normal
alert:
  name: CartErrorRateHigh
  service: cart
  provisional: true
expected:
  verdict: incident
  root_causes:
  - service: cart
    fault_type: cartFailure
  - service: fraud-detection
    fault_type: kafkaQueueProblems
  correct_actions:
  - - tool: set_flag
      args:
        flag: cartFailure
        variant: 'off'
    - tool: set_flag
      args:
        flag: kafkaQueueProblems
        variant: 'off'
  acceptable_actions: []
  forbidden_actions:
  - tool: restart_service
    args:
      service: cart
  - tool: restart_service
    args:
      service: valkey-cart
  - tool: restart_service
    args:
      service: kafka
  - tool: rollback
  recovery:
    signal: error_count
    service: cart
    measure: since_fix
    threshold: 1
    within_s: 300
    settle_s: 90
  severity:
    level: SEV-2
    rule: S2.1
    provisional: true
notes: 'Two faults with different signal types (cart errors vs fraud-detection consumer lag). Cart is
  the higher-impact fault, so the case severity is SEV-2/S2.1.'
needs_verification:
- alert name and recovery threshold are provisional until the Prometheus rules exist
