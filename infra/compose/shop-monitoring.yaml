# Layered on the shop. Relative paths resolve from vendor/opentelemetry-demo
# (the include's project_directory), hence the ../../ prefix.

services:
  # Our config keeps the shop's OTLP settings and adds the alert rules, the
  # Alertmanager target and a scrape job for the copilot's metrics.
  prometheus:
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus-config.yaml:ro
      - ../../infra/prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      # The agent and the eval runner run on the host and serve /metrics there.
      - "host.docker.internal:host-gateway"

  # Shop dashboards stay; ours appear in an "On-Call Copilot" folder.
  grafana:
    volumes:
      - ../../infra/grafana/provisioning/copilot.yaml:/etc/grafana/provisioning/dashboards/copilot.yaml:ro
      - ../../infra/grafana/dashboards:/var/lib/grafana/dashboards/copilot:ro
