      15m)) + 50.0 and (sum(kafka_consumer_group_lag_sum_ratio{group="fraud-detection",topic="orders"})) > (avg_over_time((sum(kafka_consumer_group_lag_sum_ratio{group="fraud-detection",topic="orders"}))[30m:1m]
      offset 15m)) * 1.0
    for: 2m
    labels:
      severity: page
      service: fraud-detection
      signal: consumer_lag
    annotations:
      summary: Order consumer lag growing (full shop only)
      value: '{{ $value }}'
