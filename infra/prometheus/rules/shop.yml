# GENERATED by infra/prometheus/build_rules.py from eval/telemetry/signals.py. Do not edit.
groups:
- name: shop
  rules:
  - alert: CheckoutErrorRateHigh
    expr: ((sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_kind="SPAN_KIND_SERVER"}[5m])))
      > 0.05
    for: 5m
    labels:
      severity: page
      service: checkout
      signal: error_rate
    annotations:
      summary: Checkout error rate above 5% for 5 minutes
      value: '{{ $value }}'
  - alert: CartErrorRateHigh
    expr: (sum(increase(traces_span_metrics_calls_total{service_name="cart",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) or vector(0)) >= 2.0
    for: 2m
    labels:
      severity: page
      service: cart
      signal: error_count
    annotations:
      summary: Cart is returning errors
      value: '{{ $value }}'
  - alert: ProductCatalogErrorRateHigh
    expr: ((sum(rate(traces_span_metrics_calls_total{service_name="product-catalog",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[5m])))
      > 0.05
    for: 2m
    labels:
      severity: page
      service: product-catalog
      signal: error_rate
    annotations:
      summary: Product catalog error rate above 5%
      value: '{{ $value }}'
  - alert: AdErrorRateHigh
    expr: ((sum(rate(traces_span_metrics_calls_total{service_name="ad",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="ad",span_kind="SPAN_KIND_SERVER"}[5m])))
      > 0.05
    for: 2m
    labels:
      severity: page
      service: ad
      signal: error_rate
    annotations:
      summary: Ad service error rate above 5%
      value: '{{ $value }}'
  - alert: ProductCatalogLatencyHigh
    expr: (histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[5m])))) > (avg_over_time((histogram_quantile(0.95,
      sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[5m]))))[30m:1m] offset 15m)) + 50.0 and (histogram_quantile(0.95, sum
      by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[5m])))) > (avg_over_time((histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="product-catalog",span_kind="SPAN_KIND_SERVER"}[5m]))))[30m:1m]
      offset 15m)) * 6.0
    for: 2m
    labels:
      severity: page
      service: product-catalog
      signal: latency_p95_ms
    annotations:
      summary: Product catalog p95 latency well above normal
      value: '{{ $value }}'
  - alert: FrontendLatencyHigh
    expr: (histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend-proxy",span_kind="SPAN_KIND_SERVER"}[5m])))) > (avg_over_time((histogram_quantile(0.95,
      sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend-proxy",span_kind="SPAN_KIND_SERVER"}[5m]))))[30m:1m] offset 15m)) + 50.0 and (histogram_quantile(0.95, sum
      by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend-proxy",span_kind="SPAN_KIND_SERVER"}[5m])))) > (avg_over_time((histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend-proxy",span_kind="SPAN_KIND_SERVER"}[5m]))))[30m:1m]
