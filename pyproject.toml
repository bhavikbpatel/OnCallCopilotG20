[project]
name = "oncall-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    # fastmcp 4 pulls mcp 2.x, which langchain-mcp-adapters 0.3 cannot import; keep both pins until the client
    # moves off langchain-mcp-adapters (integration note, seam 6). Exact pin for fastmcp, as its docs advise.
    "fastmcp==2.14.7",
    "mcp>=1.27,<2",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "prometheus-client>=0.21"]
# copilot/metrics.py: /metrics for Prometheus (COPILOT_METRICS_PORT)
metrics = ["prometheus-client>=0.21"]
# ui/app.py: the on-call engineer's console (streamlit run ui/app.py)
ui = ["streamlit>=1.40"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*", "eval*", "mcp_servers*", "ui*"]
