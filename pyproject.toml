[project]
name = "oncall-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    # mcp 2.x removed mcp.shared.context.RequestContext, which langchain-mcp-adapters 0.3 imports.
    "mcp>=1.9,<2",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fastmcp>=2.10,<3", "prometheus-client>=0.21"]
# MCP servers in Docker (infra/docker/mcp.Dockerfile). fastmcp 3+ needs mcp 2.x (see above).
serve = ["fastmcp>=2.10,<3"]
# copilot/metrics.py: /metrics for Prometheus (COPILOT_METRICS_PORT)
metrics = ["prometheus-client>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot*", "eval*"]
