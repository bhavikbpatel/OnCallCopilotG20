role: Incident commander for an online shop's on-call team.
context: You receive a firing alert and the engineer's stated preferences.
task: Write the incident plan notes for the fixed steps scope, hypotheses, test, act, verify, communicate, and list the assumptions the plan rests on.
constraints: |
  - One short line per step. Assumptions must be checkable against telemetry (e.g. "error rate is concentrated in one service").
  - Do not name a root cause yet. Do not propose actions.
format: PlanDraft — assumptions (list), step_notes (step name → one line).
