llm_base_url: "https://openrouter.ai/api/v1"   # key: OPENAI_API_KEY in .env (OpenRouter key)

models:
  commander:   {model: "openai/gpt-6-luna", temperature: 0.2}
  triage:      {model: "openai/gpt-5-mini", temperature: 0.1}
  diagnosis:   {model: "openai/gpt-5-mini", temperature: 0.1}
  runbook:     {model: "openai/gpt-5-mini", temperature: 0.1}
  remediation: {model: "openai/gpt-5-mini", temperature: 0.0}
  comms:       {model: "openai/gpt-5-mini", temperature: 0.2}
  single_agent: {model: "openai/gpt-5-mini", temperature: 0.1}   # C1 baseline (architecture: C1)
  reflexion:   {model: "openai/gpt-6-luna", temperature: 0.2}    # offline lesson writer (python -m copilot.reflexion)

limits:
  tool_calls: 30          # 2–3 diagnoses × 6 + remediation, verify polls and one follow-up step
  tokens: 200000
  usd: 2.0
  per_diagnosis_tool_calls: 6

architecture: C2        # E1: C0 fixed workflow | C1 single agent | C2 team of agents
max_replans: 2
max_parallel_diagnosis: 3
# Recovery check, aligned with eval/recovery/check.py and the dev cases (settle_s 90, within_s per fault).
verify_window_s: 300         # error_rate: recovered within 300 s of the fix
verify_window_by_signal:     # slower signals (dev cases D-006/007/009/010/012/020)
  latency_p95_ms: 600
  consumer_lag: 600
  memory_mb: 900
verify_poll_s: 30
verify_initial_delay_s: 40   # Prometheus lags 12–40 s
verify_settle_s: 90          # late-arriving errors from before the fix are not counted
follow_up_signals: [memory_mb]   # only leftover state (emailMemoryLeak) may get a restart after flag off
verify_min_requests: 5       # below this since the fix: too little traffic to judge → escalate, never roll back
review_enabled: true
memory_read_only: false

# Semantic search over past incidents. Blocked by the OpenRouter guardrail for now → metadata search only.
embedding_model: null   # "openai/text-embedding-3-small" once allowed
embedding_dims: 1536
