llm_base_url: "https://openrouter.ai/api/v1"   # key: OPENAI_API_KEY in .env (OpenRouter key)

models:
  commander:   {model: "openai/gpt-6-luna", temperature: 0.2}
  triage:      {model: "openai/gpt-5-mini", temperature: 0.1}
  diagnosis:   {model: "openai/gpt-5-mini", temperature: 0.1}
  runbook:     {model: "openai/gpt-5-mini", temperature: 0.1}
  remediation: {model: "openai/gpt-5-mini", temperature: 0.0}
  comms:       {model: "openai/gpt-5-mini", temperature: 0.2}

limits:
  tool_calls: 20
  tokens: 200000
  usd: 2.0
  per_diagnosis_tool_calls: 6

max_replans: 2
max_parallel_diagnosis: 3
verify_window_s: 300
verify_poll_s: 15
review_enabled: true
memory_read_only: false

# Semantic search over past incidents. Blocked by the OpenRouter guardrail for now → metadata search only.
embedding_model: null   # "openai/text-embedding-3-small" once allowed
embedding_dims: 1536
